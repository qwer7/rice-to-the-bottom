name: Check and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a database migration or publish two releases concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests and frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # This is a compilation check. Only the release job builds published assets.
      - run: npm run build

  database:
    name: Validate migrations on a disposable database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset --local --no-seed
      - if: always()
        run: supabase stop --no-backup

  deploy:
    name: Publish Supabase then Cloudflare
    needs: [check, database]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      MIGRATION_BASELINE_VERIFIED: ${{ vars.MIGRATION_BASELINE_VERIFIED }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release configuration before changing remote services
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub configuration: $name"
              exit 1
            fi
          done
          if [[ "$MIGRATION_BASELINE_VERIFIED" != 'true' ]]; then
            echo '::error::Reconcile existing Supabase migration history first. See docs/DEPLOYMENT.md.'
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != "https://${SUPABASE_PROJECT_ID}.supabase.co" ]]; then
            echo '::error::Frontend and backend must target the same Supabase project.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build production frontend before any deployment
        run: npm run build
      - uses: supabase/setup-cli@v2
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show pending migrations
        run: supabase db push --linked --dry-run
      - name: Apply pending migrations
        run: supabase db push --linked --yes
      - name: Deploy Edge Functions using JWT settings in config.toml
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Publish existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
      - name: Record released revision
        run: echo "Published commit $GITHUB_SHA to Supabase and Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
